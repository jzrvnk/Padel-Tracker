<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#176b43">
  <meta name="description" content="Bekijk de padelPlanning, spelers en statistieken.">
  <link rel="manifest" href="manifest.json">
  <title>Padelplanning</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; color: #183128; background: #f2f7f3; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    header { padding: 28px 18px; color: white; background: #176b43; }
    header > div, main { width: min(900px, 100%); margin: auto; }
    h1 { margin: 0 0 6px; font-size: clamp(1.5rem, 5vw, 2rem); }
    header p { margin: 0; opacity: .9; }
    main { padding: 20px 14px 48px; }
    nav { display: flex; gap: 8px; margin-bottom: 12px; overflow-x: auto; }
    nav button { padding: 10px 16px; color: #176b43; background: white; border: 1px solid #bdd3c3; border-radius: 8px; font: inherit; cursor: pointer; white-space: nowrap; }
    nav button.active { color: white; background: #176b43; border-color: #176b43; }
    #status { padding: 14px; text-align: center; color: #52645a; }
    .date-card { margin: 0 0 16px; padding: 18px; background: white; border-radius: 14px; box-shadow: 0 2px 10px #173b2510; }
    .date-card h2 { margin: 0 0 14px; color: #176b43; font-size: 1.15rem; text-transform: capitalize; }
    .blocked-day { padding: 18px; color: #9a3412; background: #fff7ed; border: 1px solid #fed7aa; border-radius: 10px; font-weight: 700; }
    .courts { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
    .court { padding: 14px; background: #f3f8f4; border-radius: 10px; }
    .court h3 { margin: 0 0 10px; font-size: 1rem; }
    .court ol { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 0; padding: 0; list-style: none; }
    .court li { min-height: 40px; padding: 9px 10px; overflow-wrap: anywhere; background: white; border: 1px solid #e1ebe3; border-radius: 7px; }
    .court li.empty { color: #9aa69e; }
    .court li:first-child:not(.empty) { color: #c62828; font-weight: 700; }
    .player-list { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; align-items: start; }
    .stats-list { display: grid; gap: 10px; }
    .mini-progress-wrap { flex: 0 0 150px; width: 150px; }
    .mini-progress { display: block; width: 100%; height: auto; }
    .mini-progress-empty { flex: 0 0 150px; color: #87958c; font-size: .8rem; text-align: center; }
    @media (max-width: 600px) { .stats-row { flex-wrap: wrap; } .mini-progress-wrap, .mini-progress-empty { order: 3; flex-basis: 100%; width: 100%; max-width: 220px; margin-left: 42px; } .stats-total { margin-left: auto; } }
    .player-card, .stats-row { position: relative; display: flex; align-items: center; gap: 12px; min-width: 0; padding: 14px; background: white; border: 1px solid #e1ebe3; border-radius: 10px; box-shadow: 0 2px 10px #173b2510; }
    .player-card { cursor: pointer; }
    .player-main, .stats-main { display: grid; gap: 5px; min-width: 0; }
    .player-name, .stats-name { font-weight: 650; }
    .stats-detail, .player-detail { color: #637269; font-size: .9rem; overflow-wrap: anywhere; }
    .stats-rank { min-width: 42px; font-size: 1.5rem; text-align: center; }
    .stats-total { display: grid; gap: 3px; min-width: 72px; text-align: right; }
    .stats-total strong { color: #176b43; font-size: 1.25rem; }
    .stats-total span { color: #637269; font-size: .8rem; }
    .player-popover { display: none; position: absolute; z-index: 5; top: calc(100% + 7px); left: 0; width: min(310px, calc(100vw - 48px)); padding: 14px; color: #183128; background: white; border: 1px solid #bdd3c3; border-radius: 10px; box-shadow: 0 8px 24px #173b2530; }
    .player-popover strong { display: block; margin-bottom: 8px; color: #176b43; }
    .player-popover span { display: block; margin-top: 5px; color: #52645a; font-size: .88rem; overflow-wrap: anywhere; }
    .player-card:hover .player-popover, .player-card:focus-visible .player-popover, .player-card.is-open .player-popover { display: block; }
    .player-card:nth-child(4n) .player-popover { right: 0; left: auto; }
    @media (max-width: 900px) { .player-list { grid-template-columns: repeat(3, minmax(0, 1fr)); } .player-card:nth-child(4n) .player-popover { right: auto; left: 0; } .player-card:nth-child(3n) .player-popover { right: 0; left: auto; } }
    @media (max-width: 650px) { .player-list { grid-template-columns: repeat(2, minmax(0, 1fr)); } .player-card:nth-child(3n) .player-popover { right: auto; left: 0; } .player-card:nth-child(2n) .player-popover { right: 0; left: auto; } }
    @media (max-width: 420px) { .player-list { grid-template-columns: 1fr; } .player-card:nth-child(n) .player-popover { right: auto; left: 0; } }
    .refresh { display: block; margin: 18px auto 0; padding: 10px 16px; color: #176b43; background: white; border: 1px solid #bdd3c3; border-radius: 8px; font: inherit; cursor: pointer; }
    .install-app { display: none; margin: 18px auto 0; padding: 11px 16px; color: white; background: #176b43; border: 0; border-radius: 8px; font: inherit; font-weight: 600; cursor: pointer; }
    footer { padding: 10px; color: #78867d; text-align: center; font-size: .85rem; }
  </style>
</head>
<body>
  <header><div><h1>Padel - Vrijdagavond BTC</h1><p>Planning, statistieken en spelers.</p></div></header>
  <main>
    <nav aria-label="Pagina's">
      <button type="button" class="active" data-view="reservations">Planning</button>
      <button type="button" data-view="stats">Statistieken</button>
      <button type="button" data-view="players">Spelers</button>
    </nav>
    <div id="status" role="status">Gegevens laden…</div>
    <section id="content" aria-live="polite"></section>
    <button id="refresh" class="refresh" type="button">Vernieuwen</button>
    <button id="installApp" class="install-app" type="button">Installeer de Padel-app</button>
  </main>
  <footer>Tik op ‘Vernieuwen’ om de laatste wijzigingen op te halen.</footer>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAcSZ1Y_YrNl0zQ_IFvfYDksC9gEO_3rnE",
      authDomain: "padel-club-vrijdag-btpc.firebaseapp.com",
      databaseURL: "https://padel-club-vrijdag-btpc-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "padel-club-vrijdag-btpc",
      storageBucket: "padel-club-vrijdag-btpc.firebasestorage.app",
      messagingSenderId: "698934728052",
      appId: "1:698934728052:web:de92050172426854bcc821"
    };

    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();
    const statusElement = document.getElementById('status');
    const contentElement = document.getElementById('content');
    let currentData = null;
    let currentView = 'reservations';
    const dateFormatter = new Intl.DateTimeFormat('nl-BE', {
      weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'
    });

    function nextFridays(count = 12) {
      const date = new Date();
      date.setHours(12, 0, 0, 0);
      while (date.getDay() !== 5) date.setDate(date.getDate() + 1);
      return Array.from({ length: count }, () => {
        const current = new Date(date);
        date.setDate(date.getDate() + 7);
        return current.toISOString().slice(0, 10);
      });
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, character => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      })[character]);
    }

    function getPlayers(data) {
      const source = data?.players || {};
      const players = Array.isArray(source)
        ? source
        : Object.entries(source).map(([id, player]) => ({ ...player, id: player?.id ?? id }));
      const admins = Array.isArray(data?.admins) ? data.admins : Object.values(data?.admins || {});
      return players.filter(player => player && player.id != null)
        .map(player => ({ ...player, isAdmin: admins.includes(player.username) }));
    }

    function statNumber(value) {
      const number = Number(value);
      return Number.isFinite(number) ? number : 0;
    }

    function maskEmail(value) {
      if (!value) return 'Geen e-mail';
      const parts = String(value).split('@');
      if (parts.length !== 2) return `${parts[0].slice(0, 1)}***`;
      const domainParts = parts[1].split('.');
      const domain = `${domainParts[0].slice(0, 1)}***${domainParts.length > 1 ? `.${domainParts.slice(1).join('.')}` : ''}`;
      return `${parts[0].slice(0, 1)}***@${domain}`;
    }

    function maskPhone(value) {
      if (!value) return 'Geen telefoon';
      const digits = String(value).replace(/\D/g, '');
      return digits.length > 2 ? `***${digits.slice(-2)}` : '***';
    }

    function renderReservations(data) {
      const players = getPlayers(data);
      const reservations = data?.reservations || {};
      const blockedDates = data?.blockedDates || {};
      const playerNames = new Map(players.map(player => [String(player.id), player.name || 'Speler']));
      const dates = nextFridays();
      const cards = dates.map(date => {
        const dateLabel = dateFormatter.format(new Date(`${date}T12:00:00`));
        const block = blockedDates[date];
        const isBlocked = typeof block === 'boolean' ? block : Boolean(block?.blocked);
        if (isBlocked) {
          const reason = typeof block === 'object' && block.reason ? block.reason : 'Dag geblokkeerd';
          return `<article class="date-card"><h2>${dateLabel}</h2><div class="blocked-day">${escapeHtml(reason)}</div></article>`;
        }
        const dateReservations = reservations[date] || {};
        const courts = [1, 2].map(court => {
          const names = [1, 2, 3, 4].map(position => {
            const playerId = dateReservations[`${date}-${court}-${position}`];
            return playerId ? escapeHtml(playerNames.get(String(playerId)) || 'Onbekende speler') : '';
          });
          return `<article class="court"><h3>Veld ${court}</h3><ol>${names.map(name => `<li class="${name ? '' : 'empty'}">${name || 'Vrij'}</li>`).join('')}</ol></article>`;
        }).join('');
        return `<article class="date-card"><h2>${dateLabel}</h2><div class="courts">${courts}</div></article>`;
      }).join('');

      statusElement.textContent = dates.some(date => {
        const block = blockedDates[date];
        const isBlocked = typeof block === 'boolean' ? block : Boolean(block?.blocked);
        return !isBlocked && Object.keys(reservations[date] || {}).length > 0;
      })
        ? 'Aankomende Planning'
        : 'Er zijn nog geen spelers ingepland.';
      contentElement.innerHTML = cards;
    }

    function getPlayerProgress(player, data) {
      const playerId = String(player.id);
      const allScores = Array.isArray(data?.scores) ? data.scores : Object.values(data?.scores || {});
      const matches = allScores
        .filter(score => score && score.date && Array.isArray(score.team1) && Array.isArray(score.team2)
          && [...score.team1, ...score.team2].some(id => String(id) === playerId))
        .sort((a, b) => String(a.date).localeCompare(String(b.date)) || String(a.timestamp || '').localeCompare(String(b.timestamp || '')));
      let wins = 0;
      return matches.map((score, index) => {
        const inTeam1 = score.team1.some(id => String(id) === playerId);
        const winner = score.winner || (statNumber(score.team1Sets) > statNumber(score.team2Sets) ? 'team1' : 'team2');
        if ((inTeam1 && winner === 'team1') || (!inTeam1 && winner === 'team2')) wins++;
        return { date: score.date, rate: wins / (index + 1) * 100 };
      });
    }

    function renderMiniProgress(player, data) {
      const points = getPlayerProgress(player, data);
      if (!points.length) return '<span class="mini-progress-empty">Geen wedstrijdevolutie</span>';
      const width = 150, height = 44, padding = 4;
      const x = index => points.length === 1 ? width / 2 : padding + index / (points.length - 1) * (width - padding * 2);
      const y = rate => height - padding - rate / 100 * (height - padding * 2);
      const line = points.map((point, index) => `${x(index)},${y(point.rate)}`).join(' ');
      const last = points[points.length - 1];
      return `<svg class="mini-progress" viewBox="0 0 ${width} ${height}" role="img" aria-label="Winpercentage evolutie van ${escapeHtml(player.name || 'speler')} over ${points.length} wedstrijden"><line x1="${padding}" y1="${height / 2}" x2="${width - padding}" y2="${height / 2}" stroke="#e1ebe3"/><polyline points="${line}" fill="none" stroke="#2e7d32" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="${x(points.length - 1)}" cy="${y(last.rate)}" r="3.5" fill="#176b43"/><title>${points.length} wedstrijden · laatste cumulatieve winpercentage ${last.rate.toFixed(0)}%</title></svg>`;
    }

    function renderStats(data) {
      const players = getPlayers(data).filter(player => statNumber(player.stats?.matchesPlayed) > 0);
      const leaderboard = players
        .map(player => ({ ...player, winRate: statNumber(player.stats.matchesWon) / statNumber(player.stats.matchesPlayed) * 100 }))
        .sort((a, b) => b.winRate - a.winRate || statNumber(b.stats.setsWon) - statNumber(a.stats.setsWon));
      statusElement.textContent = leaderboard.length ? 'Klassement' : 'Er zijn nog geen statistieken beschikbaar.';
      contentElement.innerHTML = `<div class="stats-list">${leaderboard.map((player, index) => {
        const stats = player.stats;
        const medal = ['&#129351;', '&#129352;', '&#129353;'][index] || `${index + 1}.`;
        return `<article class="stats-row"><div class="stats-rank">${medal}</div><div class="stats-main"><div class="stats-name">${escapeHtml(player.name || 'Speler')}</div><div class="stats-detail">${statNumber(stats.matchesWon)} gewonnen · ${statNumber(stats.matchesLost)} verloren · sets ${statNumber(stats.setsWon)}-${statNumber(stats.setsLost)}</div></div><div class="mini-progress-wrap">${renderMiniProgress(player, data)}</div><div class="stats-total"><strong>${player.winRate.toFixed(0)}%</strong><span>${statNumber(stats.matchesPlayed)} matchen</span></div></article>`;
      }).join('')}</div>`;
    }

    function renderPlayers(data) {
      const players = getPlayers(data).sort((a, b) => (a.name || '').localeCompare(b.name || '', 'nl'));
      statusElement.textContent = players.length ? `${players.length} spelers` : 'Er zijn nog geen spelers beschikbaar.';
      contentElement.innerHTML = `<div class="player-list">${players.map(player => {
        const stats = player.stats || {};
        const played = statNumber(stats.matchesPlayed);
        const winRate = played ? (statNumber(stats.matchesWon) / played * 100).toFixed(0) : '0';
        const name = escapeHtml(player.name || 'Speler');
        const username = escapeHtml(player.username || 'Geen gebruikersnaam');
        const email = escapeHtml(maskEmail(player.email));
        const phone = escapeHtml(maskPhone(player.phone));
        const availability = player.available == null
          ? 'Beschikbaarheid niet opgegeven'
          : player.available ? 'Beschikbaar voor vervanging' : 'Niet beschikbaar voor vervanging';
        return `<article class="player-card" tabindex="0" role="button" aria-expanded="false" aria-label="Details van ${name}"><div class="player-main"><span class="player-name">${name}</span><span class="player-detail">${winRate}% winst · ${played} matchen</span></div><div class="player-popover" role="tooltip"><strong>${name}${player.isAdmin ? ' · Beheerder' : ''}</strong><span>Gebruikersnaam: ${username}</span><span>E-mail: ${email}</span><span>Telefoon: ${phone}</span><span>${escapeHtml(availability)}</span><span>Matchen: ${played}</span><span>Gewonnen / verloren: ${statNumber(stats.matchesWon)} / ${statNumber(stats.matchesLost)}</span><span>Sets gewonnen / verloren: ${statNumber(stats.setsWon)} / ${statNumber(stats.setsLost)}</span><span>Winpercentage: ${winRate}%</span></div></article>`;
      }).join('')}</div>`;
    }

    function renderCurrentView() {
      if (!currentData) return;
      if (currentView === 'stats') renderStats(currentData);
      else if (currentView === 'players') renderPlayers(currentData);
      else renderReservations(currentData);
    }

    function loadSchedule() {
      statusElement.textContent = 'Planning laden…';
      database.ref('padel-data').once('value')
        .then(snapshot => {
          const data = snapshot.val();
          if (!data) {
            contentElement.replaceChildren();
            statusElement.textContent = 'Er is nog geen planning beschikbaar.';
            return;
          }
          currentData = data;
          renderCurrentView();
        })
        .catch(error => {
          console.error('Planning laden mislukt:', error);
          contentElement.replaceChildren();
          statusElement.textContent = error.code === 'PERMISSION_DENIED'
            ? 'Firebase blokkeert de gegevens. Geef padel-data openbare leesrechten in de Firebase Realtime Database Rules.'
            : `De planning kon niet worden geladen (${error.code || 'verbindingsfout'}). Controleer de internetverbinding en Firebase Realtime Database Rules.`;
        });
    }

    document.querySelectorAll('[data-view]').forEach(button => {
      button.addEventListener('click', () => {
        currentView = button.dataset.view;
        document.querySelectorAll('[data-view]').forEach(tab => tab.classList.toggle('active', tab === button));
        renderCurrentView();
      });
    });
    contentElement.addEventListener('click', event => {
      const card = event.target.closest('.player-card');
      contentElement.querySelectorAll('.player-card.is-open').forEach(openCard => {
        if (openCard !== card) {
          openCard.classList.remove('is-open');
          openCard.setAttribute('aria-expanded', 'false');
        }
      });
      if (card) {
        const isOpen = card.classList.toggle('is-open');
        card.setAttribute('aria-expanded', String(isOpen));
      }
    });
    contentElement.addEventListener('pointerout', event => {
      const card = event.target.closest('.player-card');
      if (!card || event.pointerType !== 'mouse' || card.contains(event.relatedTarget)) return;
      card.classList.remove('is-open');
      card.setAttribute('aria-expanded', 'false');
    });
    document.addEventListener('pointerdown', event => {
      if (event.target.closest('.player-card')) return;
      contentElement.querySelectorAll('.player-card.is-open').forEach(card => {
        card.classList.remove('is-open');
        card.setAttribute('aria-expanded', 'false');
      });
    });
    contentElement.addEventListener('keydown', event => {
      if ((event.key === 'Enter' || event.key === ' ') && event.target.matches('.player-card')) {
        event.preventDefault();
        event.target.click();
      }
    });
    document.getElementById('refresh').addEventListener('click', loadSchedule);
    let deferredInstallPrompt = null;
    const installButton = document.getElementById('installApp');
    window.addEventListener('beforeinstallprompt', event => {
      event.preventDefault();
      deferredInstallPrompt = event;
      installButton.style.display = 'block';
    });
    installButton.addEventListener('click', async () => {
      if (!deferredInstallPrompt) return;
      deferredInstallPrompt.prompt();
      await deferredInstallPrompt.userChoice;
      deferredInstallPrompt = null;
      installButton.style.display = 'none';
    });
    window.addEventListener('appinstalled', () => {
      deferredInstallPrompt = null;
      installButton.style.display = 'none';
    });
    loadSchedule();
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' })
          .then(registration => registration.update())
          .catch(console.error);
      });
    }
  </script>
</body>
</html>
