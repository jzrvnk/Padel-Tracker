<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#176b43">
  <meta name="description" content="Bekijk de padelPlanning, spelers en statistieken.">
  <link rel="manifest" href="manifest.json">
  <title>Padelplanning</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; color: #183128; background: #f2f7f3; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    header { padding: 28px 18px; color: white; background: #176b43; }
    header > div, main { width: min(900px, 100%); margin: auto; }
    h1 { margin: 0 0 6px; font-size: clamp(1.5rem, 5vw, 2rem); }
    header p { margin: 0; opacity: .9; }
    main { padding: 20px 14px 48px; }
    nav { display: flex; gap: 8px; margin-bottom: 12px; overflow-x: auto; }
    nav button { padding: 10px 16px; color: #176b43; background: white; border: 1px solid #bdd3c3; border-radius: 8px; font: inherit; cursor: pointer; white-space: nowrap; }
    nav button.active { color: white; background: #176b43; border-color: #176b43; }
    #status { padding: 14px; text-align: center; color: #52645a; }
    .date-card { margin: 0 0 16px; padding: 18px; background: white; border-radius: 14px; box-shadow: 0 2px 10px #173b2510; }
    .date-card h2 { margin: 0 0 14px; color: #176b43; font-size: 1.15rem; text-transform: capitalize; }
    .courts { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
    .court { padding: 14px; background: #f3f8f4; border-radius: 10px; }
    .court h3 { margin: 0 0 10px; font-size: 1rem; }
    .court ol { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 0; padding: 0; list-style: none; }
    .court li { min-height: 40px; padding: 9px 10px; overflow-wrap: anywhere; background: white; border: 1px solid #e1ebe3; border-radius: 7px; }
    .court li.empty { color: #9aa69e; }
    .player-list, .stats-list { display: grid; gap: 10px; }
    .player-row, .stats-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 16px; background: white; border-radius: 10px; box-shadow: 0 2px 10px #173b2510; }
    .player-main, .stats-main { display: grid; gap: 5px; min-width: 0; }
    .player-name, .stats-name { font-weight: 650; }
    .stats-detail, .player-detail { color: #637269; font-size: .9rem; overflow-wrap: anywhere; }
    .stats-rank { min-width: 42px; font-size: 1.5rem; text-align: center; }
    .stats-total { display: grid; gap: 3px; min-width: 72px; text-align: right; }
    .stats-total strong { color: #176b43; font-size: 1.25rem; }
    .stats-total span { color: #637269; font-size: .8rem; }
    .refresh { display: block; margin: 18px auto 0; padding: 10px 16px; color: #176b43; background: white; border: 1px solid #bdd3c3; border-radius: 8px; font: inherit; cursor: pointer; }
    footer { padding: 10px; color: #78867d; text-align: center; font-size: .85rem; }
  </style>
</head>
<body>
  <header><div><h1>Padelclub</h1><p>Planning, statistieken en spelers.</p></div></header>
  <main>
    <nav aria-label="Pagina's">
      <button type="button" class="active" data-view="reservations">Planning</button>
      <button type="button" data-view="stats">Statistieken</button>
      <button type="button" data-view="players">Spelers</button>
    </nav>
    <div id="status" role="status">Gegevens laden…</div>
    <section id="content" aria-live="polite"></section>
    <button id="refresh" class="refresh" type="button">Vernieuwen</button>
  </main>
  <footer>Tik op ‘Vernieuwen’ om de laatste wijzigingen op te halen.</footer>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAcSZ1Y_YrNl0zQ_IFvfYDksC9gEO_3rnE",
      authDomain: "padel-club-vrijdag-btpc.firebaseapp.com",
      databaseURL: "https://padel-club-vrijdag-btpc-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "padel-club-vrijdag-btpc",
      storageBucket: "padel-club-vrijdag-btpc.firebasestorage.app",
      messagingSenderId: "698934728052",
      appId: "1:698934728052:web:de92050172426854bcc821"
    };

    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();
    const statusElement = document.getElementById('status');
    const contentElement = document.getElementById('content');
    let currentData = null;
    let currentView = 'reservations';
    const dateFormatter = new Intl.DateTimeFormat('nl-BE', {
      weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'
    });

    function nextFridays(count = 12) {
      const date = new Date();
      date.setHours(12, 0, 0, 0);
      while (date.getDay() !== 5) date.setDate(date.getDate() + 1);
      return Array.from({ length: count }, () => {
        const current = new Date(date);
        date.setDate(date.getDate() + 7);
        return current.toISOString().slice(0, 10);
      });
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, character => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      })[character]);
    }

    function getPlayers(data) {
      const players = Array.isArray(data?.players) ? data.players : Object.values(data?.players || {});
      return players.filter(player => player && player.id != null);
    }

    function statNumber(value) {
      const number = Number(value);
      return Number.isFinite(number) ? number : 0;
    }

    function renderReservations(data) {
      const players = getPlayers(data);
      const reservations = data?.reservations || {};
      const playerNames = new Map(players.map(player => [String(player.id), player.name || 'Speler']));
      const dates = nextFridays();
      const cards = dates.map(date => {
        const dateReservations = reservations[date] || {};
        const courts = [1, 2].map(court => {
          const names = [1, 2, 3, 4].map(position => {
            const playerId = dateReservations[`${date}-${court}-${position}`];
            return playerId ? escapeHtml(playerNames.get(String(playerId)) || 'Onbekende speler') : '';
          });
          return `<article class="court"><h3>Veld ${court}</h3><ol>${names.map(name => `<li class="${name ? '' : 'empty'}">${name || 'Vrij'}</li>`).join('')}</ol></article>`;
        }).join('');
        const dateLabel = dateFormatter.format(new Date(`${date}T12:00:00`));
        return `<article class="date-card"><h2>${dateLabel}</h2><div class="courts">${courts}</div></article>`;
      }).join('');

      statusElement.textContent = dates.some(date => Object.keys(reservations[date] || {}).length)
        ? 'Aankomende Planning'
        : 'Er zijn nog geen spelers ingepland.';
      contentElement.innerHTML = cards;
    }

    function renderStats(data) {
      const leaderboard = getPlayers(data).filter(player => statNumber(player.stats?.matchesPlayed) > 0)
        .map(player => ({ ...player, winRate: statNumber(player.stats.matchesWon) / statNumber(player.stats.matchesPlayed) * 100 }))
        .sort((a, b) => b.winRate - a.winRate || statNumber(b.stats.setsWon) - statNumber(a.stats.setsWon));
      statusElement.textContent = leaderboard.length ? 'Klassement' : 'Er zijn nog geen statistieken beschikbaar.';
      contentElement.innerHTML = `<div class="stats-list">${leaderboard.map((player, index) => {
        const stats = player.stats;
        const medal = ['🥇', '🥈', '🥉'][index] || `${index + 1}.`;
        return `<article class="stats-row"><div class="stats-rank">${medal}</div><div class="stats-main"><div class="stats-name">${escapeHtml(player.name || 'Speler')}</div><div class="stats-detail">${statNumber(stats.matchesWon)} gewonnen · ${statNumber(stats.matchesLost)} verloren · sets ${statNumber(stats.setsWon)}-${statNumber(stats.setsLost)}</div></div><div class="stats-total"><strong>${player.winRate.toFixed(0)}%</strong><span>${statNumber(stats.matchesPlayed)} matchen</span></div></article>`;
      }).join('')}</div>`;
    }

    function renderPlayers(data) {
      const players = getPlayers(data).sort((a, b) => (a.name || '').localeCompare(b.name || '', 'nl'));
      statusElement.textContent = players.length ? `${players.length} spelers` : 'Er zijn nog geen spelers beschikbaar.';
      contentElement.innerHTML = `<div class="player-list">${players.map(player => {
        const stats = player.stats;
        const played = statNumber(stats?.matchesPlayed);
        const winRate = played ? (statNumber(stats.matchesWon) / played * 100).toFixed(0) : '0';
        const email = player.email ? escapeHtml(player.email) : 'Geen e-mail';
        const phone = player.phone ? escapeHtml(player.phone) : 'Geen telefoon';
        const username = player.username ? escapeHtml(player.username) : 'Geen gebruikersnaam';
        const record = played
          ? `${played} matchen · ${statNumber(stats.matchesWon)} gewonnen · ${statNumber(stats.matchesLost)} verloren · sets ${statNumber(stats.setsWon)}-${statNumber(stats.setsLost)} · winrate ${winRate}%`
          : 'Nog geen statistieken';
        return `<article class="player-row"><div class="player-main"><span class="player-name">${escapeHtml(player.name || 'Speler')}</span><span class="player-detail">${username} · ${email} · ${phone}</span><span class="player-detail">${record}</span></div></article>`;
      }).join('')}</div>`;
    }

    function renderCurrentView() {
      if (!currentData) return;
      if (currentView === 'stats') renderStats(currentData);
      else if (currentView === 'players') renderPlayers(currentData);
      else renderReservations(currentData);
    }

    function loadSchedule() {
      statusElement.textContent = 'Planning laden…';
      database.ref('public-schedule').once('value')
        .then(snapshot => {
          const data = snapshot.val();
          if (!data) {
            contentElement.replaceChildren();
            statusElement.textContent = 'Er is nog geen planning beschikbaar.';
            return;
          }
          currentData = data;
          renderCurrentView();
        })
        .catch(error => {
          console.error('Planning laden mislukt:', error);
          contentElement.replaceChildren();
          statusElement.textContent = error.code === 'PERMISSION_DENIED'
            ? 'Firebase blokkeert de planning. Geef public-schedule openbare leesrechten in de Firebase Realtime Database Rules.'
            : `De planning kon niet worden geladen (${error.code || 'verbindingsfout'}). Controleer de internetverbinding en Firebase Realtime Database Rules.`;
        });
    }

    document.querySelectorAll('[data-view]').forEach(button => {
      button.addEventListener('click', () => {
        currentView = button.dataset.view;
        document.querySelectorAll('[data-view]').forEach(tab => tab.classList.toggle('active', tab === button));
        renderCurrentView();
      });
    });
    document.getElementById('refresh').addEventListener('click', loadSchedule);
    loadSchedule();
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(console.error));
    }
  </script>
</body>
</html>
